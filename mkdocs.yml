site_name: TFG — Modelo de almacenamiento solar adaptativo
site_description: Memoria, código y validaciones del TFG de Carlos Molina Centeno (UCM)
site_author: Carlos Molina Centeno
repo_url: https://github.com/CarlosMolinaCenteno/tfg-solar-abm
repo_name: CarlosMolinaCenteno/tfg-solar-abm
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: es
  - mkdocs-jupyter:
      include_source: true
      execute: false
      ignore_h1_titles: true

nav:
  - Inicio: index.md
  - Memoria:
      - Índice: memoria/index.md
      - Resumen / Abstract: memoria/00-resumen.md
      - 1. Introducción: memoria/01-introduccion.md
      - "2. Model: mercado y agentes": memoria/02-model.md
      - 3. Soluciones bajo racionalidad: memoria/03-racionalidad.md
      - 4. Aprendizaje: memoria/04-aprendizaje.md
      - 5. Papel de las baterías: memoria/05-baterias.md
      - Bibliografía: memoria/bibliografia.md
  - Anexos:
      - A. Agente único: anexos/a-agente-unico.md
      - B. Nash heterogéneo: anexos/b-nash-heterogeneo.md
      - Validación del modelo: anexos/validacion.md
  - Validación:
      - Índice: validacion/index.md
      - Banco de pruebas: validacion/banco_pruebas.ipynb
  - Extras:
      - Notas de aprendizaje: extras/notas-aprendizaje.md
